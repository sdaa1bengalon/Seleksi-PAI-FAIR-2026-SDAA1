<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seleksi Peserta LCC PAI FAIR 2026 - SD Anugerah Abadi 1 Bengalon</title>
  <style>
    :root {
      --primary-color: #0d6efd;
      --secondary-color: #0b5ed7;
      --success-color: #198754;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #212529;
      --border-radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.5; padding: 15px; }
    .container { max-width: 1050px; margin: 0 auto; }
    
    header {
      text-align: center; margin-bottom: 20px;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white; padding: 20px; border-radius: var(--border-radius);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    header h1 { font-size: 1.5rem; margin-bottom: 4px; }
    header p { font-size: 0.95rem; opacity: 0.9; }

    .card {
      background: var(--card-bg); border-radius: var(--border-radius);
      padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95rem; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; font-size: 1rem; }

    .btn {
      display: inline-block; background-color: var(--primary-color); color: white;
      border: none; padding: 10px 18px; font-size: 0.95rem; font-weight: 600;
      border-radius: 6px; cursor: pointer; transition: all 0.2s;
    }
    .btn:hover { background-color: var(--secondary-color); }
    .btn-secondary { background-color: #6c757d; }
    .btn-secondary:hover { background-color: #5a6268; }
    .btn-warning { background-color: #ffc107; color: #000; }
    .btn-warning:hover { background-color: #e0a800; }
    .btn-success { background-color: var(--success-color); }
    .btn-success:hover { background-color: #146c43; }

    .hidden { display: none !important; }

    .quiz-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
    @media (max-width: 768px) { .quiz-layout { grid-template-columns: 1fr; } }

    .quiz-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e9ecef; padding-bottom: 10px; margin-bottom: 15px; }
    .question-number { font-weight: bold; font-size: 1.1rem; color: var(--primary-color); }
    .question-text { font-size: 1.05rem; font-weight: 600; margin-bottom: 18px; }

    .options-list { list-style: none; }
    .option-item { margin-bottom: 10px; }
    .option-item label {
      display: flex; align-items: center; padding: 10px 12px;
      border: 1px solid #dee2e6; border-radius: 6px; cursor: pointer; transition: background-color 0.2s;
    }
    .option-item label:hover { background-color: #f8f9fa; }
    .option-item input[type="radio"] { margin-right: 10px; }

    .grid-container { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 12px; }
    .grid-title { font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; text-align: center; color: #495057; }
    .number-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 320px; overflow-y: auto; padding-right: 4px; }
    
    .num-box {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      background-color: #e9ecef; color: #333; font-weight: bold; font-size: 0.85rem;
      border-radius: 4px; cursor: pointer; border: 2px solid transparent; user-select: none;
    }
    .num-box.answered { background-color: #198754 !important; color: white !important; }
    .num-box.active { border-color: #0d6efd !important; box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.4); }

    .nav-footer { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
    
    .element-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 6px; margin-bottom: 8px; background-color: #fff;
    }
    .badge { font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    .badge-success { background: #d1e7dd; color: #0f5132; }
    .badge-warning { background: #fff3cd; color: #664d03; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>SELEKSI PESERTA LCC PAI FAIR 2026</h1>
      <p>SD Anugerah Abadi 1 Bengalon</p>
    </header>

    <!-- DASHBOARD LOGIN & PILIH ELEMEN -->
    <div id="dashboard-card" class="card">
      <h2 style="margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 8px;">Dashboard Peserta</h2>
      
      <div id="user-info-form">
        <div class="form-group">
          <label for="student-name">Nama Lengkap Peserta</label>
          <input type="text" id="student-name" placeholder="Masukkan nama lengkap" required>
        </div>
        <div class="form-group">
          <label for="student-class">Kelas</label>
          <select id="student-class" required>
            <option value="">-- Pilih Kelas --</option>
            <option value="4">Kelas 4</option>
            <option value="5">Kelas 5</option>
            <option value="6">Kelas 6</option>
          </select>
        </div>
        <button type="button" class="btn" onclick="saveUserInfo()">Simpan & Lanjutkan Pilihan Elemen</button>
      </div>

      <div id="element-selection-area" class="hidden">
        <div style="margin-bottom: 15px; background: #e7f1ff; padding: 10px; border-radius: 6px;" id="active-user-badge"></div>
        <h3 style="font-size: 1rem; margin-bottom: 10px;">Pilih Elemen Lomba yang Ingin Dikerjakan:</h3>
        <div class="element-progress-list" id="element-list"></div>
        <button class="btn btn-success" style="width: 100%; margin-top: 20px;" onclick="submitAllToSheets()">Kirim Seluruh Hasil ke Google Sheets</button>
      </div>
    </div>

    <!-- TAMPILAN SOAL & NAVIGASI ANBK -->
    <div id="quiz-card" class="card hidden">
      <div style="margin-bottom: 15px;">
        <button class="btn btn-warning" onclick="returnToDashboard()">← Kembali ke Dashboard / Pindah Elemen</button>
      </div>

      <div class="quiz-layout">
        <div>
          <div class="quiz-header">
            <div class="question-number" id="q-number">Soal 1 dari 40</div>
            <div id="quiz-element-title" style="font-weight: 600; color: #495057;">Elemen A</div>
          </div>
          <div class="question-text" id="q-text">Memuat soal...</div>
          <ul class="options-list" id="q-options"></ul>
          <div class="nav-footer">
            <button id="btn-prev" class="btn btn-secondary" onclick="prevQuestion()">Sebelumnya</button>
            <button id="btn-next" class="btn" onclick="nextQuestion()">Berikutnya</button>
          </div>
        </div>

        <div>
          <div class="grid-container">
            <div class="grid-title">NAVIGASI SOAL (ANBK)</div>
            <div class="number-grid" id="number-grid"></div>
            <div style="margin-top: 15px; font-size: 0.75rem; color: #6c757d;">
              <span style="display:inline-block; width:10px; height:10px; background:#198754; border-radius:2px;"></span> Sudah Diisi &nbsp;
              <span style="display:inline-block; width:10px; height:10px; background:#e9ecef; border-radius:2px;"></span> Belum Diisi
            </div>
            <button class="btn btn-success" style="width: 100%; margin-top: 15px;" onclick="submitCurrentElement()">Simpan Elemen Ini</button>
          </div>
        </div>
      </div>
    </div>
  </div>

        { q: "40. Sikap yang benar saat orang tua sedang berbicara memberikan nasihat adalah...", options: ["A. Mendengarkan dengan tenang dan patuh", "B. Menyela pembicaraannya", "C. Ditinggal pergi", "D. Acuh tak acuh"], answer: 0 }

    };

    let currentUser = { name: "", class: "" };
    let activeElement = "";
    let currentIdx = 0;
    
    let allUserAnswers = {
      "A": new Array(40).fill(null),
      "B": new Array(40).fill(null),
      "C": new Array(40).fill(null),
      "D": new Array(40).fill(null),
      "E": new Array(40).fill(null),
      "F": new Array(40).fill(null)
    };

    function saveUserInfo() {
      const name = document.getElementById('student-name').value.trim();
      const cls = document.getElementById('student-class').value;

      if (!name || !cls) {
        alert("Harap isi Nama dan Kelas terlebih dahulu!");
        return;
      }

      currentUser.name = name;
      currentUser.class = cls;

      document.getElementById('user-info-form').classList.add('hidden');
      document.getElementById('element-selection-area').classList.remove('hidden');
      document.getElementById('active-user-badge').innerHTML = `<b>Peserta:</b> ${currentUser.name} | <b>Kelas:</b> ${currentUser.class}`;

      renderElementList();
    }

    function renderElementList() {
      const container = document.getElementById('element-list');
      container.innerHTML = "";

      Object.keys(elementsInfo).forEach(key => {
        const answeredCount = allUserAnswers[key].filter(x => x !== null).length;
        const isComplete = answeredCount === 40;

        const div = document.createElement('div');
        div.className = 'element-item';
        div.innerHTML = `
          <div>
            <strong>Elemen ${key}: ${elementsInfo[key]}</strong>
            <br><small style="color: #6c757d;">Progres: ${answeredCount} dari 40 soal diisi</small>
          </div>
          <div>
            <span class="badge ${isComplete ? 'badge-success' : 'badge-warning'}">${isComplete ? 'Selesai' : 'Belum Selesai'}</span>
            <button class="btn" style="margin-left: 10px; padding: 6px 12px; font-size: 0.85rem;" onclick="startElement('${key}')">
              ${answeredCount > 0 ? 'Lanjutkan' : 'Mulai'}
            </button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function startElement(elemKey) {
      activeElement = elemKey;
      currentIdx = 0;

      document.getElementById('dashboard-card').classList.add('hidden');
      document.getElementById('quiz-card').classList.remove('hidden');
      document.getElementById('quiz-element-title').innerText = `Elemen ${elemKey}: ${elementsInfo[elemKey]}`;

      loadQuestion();
      renderGrid();
    }

    function loadQuestion() {
      const q = questionBank[activeElement][currentIdx];
      document.getElementById('q-number').innerText = `Soal ${currentIdx + 1} dari 40`;
      document.getElementById('q-text').innerText = q.q;

      const optionsUl = document.getElementById('q-options');
      optionsUl.innerHTML = '';

      const currentAnswers = allUserAnswers[activeElement];

      q.options.forEach((opt, idx) => {
        const li = document.createElement('li');
        li.className = 'option-item';
        
        const isChecked = currentAnswers[currentIdx] === idx ? 'checked' : '';
        
        li.innerHTML = `
          <label>
            <input type="radio" name="option" value="${idx}" ${isChecked} onchange="selectOption(${idx})">
            ${opt}
          </label>
        `;
        optionsUl.appendChild(li);
      });

      document.getElementById('btn-prev').style.visibility = currentIdx === 0 ? 'hidden' : 'visible';
      document.getElementById('btn-next').innerText = currentIdx === 39 ? 'Selesai Elemen Ini' : 'Berikutnya';

      updateGridHighlight();
    }

    function selectOption(optIdx) {
      allUserAnswers[activeElement][currentIdx] = optIdx;
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('number-grid');
      grid.innerHTML = '';

      const currentAnswers = allUserAnswers[activeElement];

      for (let i = 0; i < 40; i++) {
        const box = document.createElement('div');
        box.className = 'num-box';
        box.innerText = i + 1;

        if (currentAnswers[i] !== null) {
          box.classList.add('answered');
        }

        if (i === currentIdx) {
          box.classList.add('active');
        }

        box.onclick = () => {
          currentIdx = i;
          loadQuestion();
        };

        grid.appendChild(box);
      }
    }

    function updateGridHighlight() {
      const boxes = document.querySelectorAll('.num-box');
      boxes.forEach((box, idx) => {
        if (idx === currentIdx) {
          box.classList.add('active');
        } else {
          box.classList.remove('active');
        }
      });
    }

    function nextQuestion() {
      if (currentIdx < 39) {
        currentIdx++;
        loadQuestion();
      } else {
        submitCurrentElement();
      }
    }

    function prevQuestion() {
      if (currentIdx > 0) {
        currentIdx--;
        loadQuestion();
      }
    }

    function returnToDashboard() {
      document.getElementById('quiz-card').classList.add('hidden');
      document.getElementById('dashboard-card').classList.remove('hidden');
      renderElementList();
    }

    function submitCurrentElement() {
      const answeredCount = allUserAnswers[activeElement].filter(x => x !== null).length;
      alert(`Progress Elemen ${activeElement} tersimpan! (${answeredCount} dari 40 diisi)`);
      returnToDashboard();
    }

    function submitAllToSheets() {
      const scores = {};
      let totalBenar = 0;

      Object.keys(elementsInfo).forEach(elem => {
        let benar = 0;
        questionBank[elem].forEach((q, idx) => {
          if (allUserAnswers[elem][idx] === q.answer) {
            benar++;
          }
        });
        scores[elem] = Math.round((benar / 40) * 100);
        totalBenar += benar;
      });

      const totalSkorAkhir = Math.round((totalBenar / 240) * 100);

      const payload = {
        nama: currentUser.name,
        kelas: currentUser.class,
        skorA: scores["A"],
        skorB: scores["B"],
        skorC: scores["C"],
        skorD: scores["D"],
        skorE: scores["E"],
        skorF: scores["F"],
        totalSkor: totalSkorAkhir,
        waktu: new Date().toLocaleString('id-ID')
      };

      if (!SPREADSHEET_WEB_APP_URL || SPREADSHEET_WEB_APP_URL.includes("URL_GOOGLE_APPS_SCRIPT_ANDA_DI_SINI")) {
        alert("URL Google Apps Script belum dimasukkan di variabel SPREADSHEET_WEB_APP_URL!");
        return;
      }

      fetch(SPREADSHEET_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("Seluruh nilai berhasil dikirim ke Google Sheets! Terima kasih sudah berpartisipasi.");
        location.reload();
      })
      .catch(err => {
        alert("Gagal mengirim data. Pastikan koneksi internet stabil.");
      });
    }
  </script>
